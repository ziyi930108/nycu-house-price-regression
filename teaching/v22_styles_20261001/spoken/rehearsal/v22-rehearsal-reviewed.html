</main><script id="deckData" type="application/json">{"source_sha256": "cf1d642550771fbd8a58aebd78bc024cab81bc58ab5151671a091e9465bb8302", "slides": [{"number": 1, "title": "臺灣房屋總價預測", "takeaway": "利用已知成交資料，估計一筆新交易的總價。", "script": "大家好，今天要介紹的是臺灣房屋總價預測。先想一個情境：我們拿到一筆房屋交易，知道面積、地點和成交日期，卻不知道總價。能不能從以前的成交資料，估出這筆交易大概多少錢？\n\n這就是這次要做的事。今天只介紹已選定提交的模型，檔案裡叫做版本二十二。大家不需要先學過機器學習。\n\n我會從電腦怎麼學估價開始，再說明資料怎麼整理、幾種估價方法怎麼組合，以及最後怎麼檢查。每一步都會交代為什麼這樣做，哪些地方還不能下定論。", "seconds": 40}, {"number": 2, "title": "回歸與模型學習", "takeaway": "模型從有答案的交易學習，再替沒有答案的交易估價。", "script": "金額是連續數值，預測這類數值的問題，就叫回歸。機器學習可以想成：讓電腦從很多題目和答案中，找出估價規則。面積、樓層和地點是題目提供的線索，叫做特徵。\n\n已知的成交總價是答案，叫做標籤。學習時，模型先估一個價格，看看和答案差多少，再調整規則。反覆練習之後，把學好的規則保存起來。\n\n之後遇到沒有答案的新交易，就只看房屋條件來估價。前面學規則叫訓練，後面套用規則叫推論。我們採用這種方法，是因為地點、面積和建物型態會一起影響價格，很難用一條人工公式全部處理。\n\n不過練習得好還不夠，接下來要用沒參與學習的交易檢查。", "seconds": 45}, {"number": 3, "title": "平均絕對誤差", "takeaway": "MAE 是每筆估價差距的平均，單位仍是新臺幣元。", "script": "那麼，怎麼知道估得好不好？比賽看的是平均絕對誤差，英文叫ＭＡＥ。我們直接算一次。\n\n這裡是教學例子，兩間房的真價都是一千萬元。第一間估一千一百萬元，多估一百萬；第二間估九百五十萬元，少估五十萬。我們只看差距大小，把一百萬和五十萬加起來，再除以兩筆，得到七十五萬元。\n\n這就是這兩筆的平均絕對誤差。為什麼要取絕對值？因為多估和少估都是誤差，不能互相抵銷。\n\n分數越低，表示這批交易的平均金額差距越小。要注意，七十五萬元不是答對的百分比，也不是說每一筆都剛好差七十五萬。後面不管看到本機回測還是平台分數，都用這個方式讀：先看是哪一批交易，再看平均差多少錢。", "seconds": 50}, {"number": 4, "title": "四份資料的用途", "takeaway": "本機 valid 與 Kaggle 的 Public／Private 是不同的分工。", "script": "先把手上的四份資料分清楚。第一份是訓練檔，大約四十五萬六千列，有房屋條件，也有總價答案。第二份叫驗證檔，大約一萬二千列，同樣有答案；這個提交模型是在最後完整訓練時，才把它加進來。\n\n第三份是測試檔，共四萬七千零七十三筆，沒有總價，我們要全部估出來。第四份是提交範本，告訴我們欄位名稱和編號順序，裡面的範例價格不能拿來學。還有一個容易混淆的地方。\n\n平台把測試檔分成兩部分，約三成計算公開分數，叫Public；其餘約七成計算隱藏分數，叫Private。所以這個三比七，分的是測試檔，不是剛才那份有答案的驗證檔。分清楚用途，才不會拿錯資料，也不會誤以為我們已經知道隱藏部分的答案。", "seconds": 50}, {"number": 5, "title": "完整工作流程", "takeaway": "先檢查方法，再建立最終模型與提交檔。", "script": "先看整條流程，後面每一步都可以放回這張圖。第一步，讀取原始檔，確認欄位、筆數和資料順序。第二步，處理格式問題和完全重複的內容。\n\n第三步，把日期、樓層和地址整理成模型能比較的線索。接著才建立模型。我們先用較早的資料學習，再用後面一年的交易評分，看看方法遇到之後的市場還行不行。\n\n確定方法後，才用最後可用的有答案資料建立模型，預測測試檔，並檢查提交格式。為什麼要分這麼多關？因為跑得動不代表正確。\n\n像是資料順序一旦錯開，這間房的條件就可能配到另一間房的價格。後面再怎麼訓練也會出問題。所以除了分數，資料順序、程式和保存模型，也都要能追查。", "seconds": 50}, {"number": 6, "title": "資料清理", "takeaway": "只修正格式與完全重複，保留測試交易。", "script": "先看資料清理。原始訓練檔混入三列英文表頭，這三列不是交易，要先移除。接著把編號放在一旁，比較其他所有原始欄位，總價也一起比對。\n\n內容完全一樣才算重複，這一步移除了五百二十九列。為什麼不直接照編號刪？因為編號相同，不一定代表交易內容完全一樣。\n\n最後加進有答案的驗證檔時，又移除了二十八列跨檔重複。清理完，共有四十六萬七千二百二十一筆可用的有標籤資料。這樣處理，是為了避免同一筆內容反覆影響模型。\n\n測試檔則一筆也不能少，因為每個編號都要交出預測。其他缺失和異常也按固定規則處理，不能因為某筆價格很難估，就把它刪掉。", "seconds": 50}, {"number": 7, "title": "特徵工程與欄位取捨", "takeaway": "把房屋線索整理成可學習的資訊，同時排除答案線索。", "script": "清理完，下一步是整理房屋線索，這叫特徵工程。例如把民國日期換成可計算的時間，把中文樓層分出地下室或整棟，再從地址拆出行政區和道路。面積也可以換算成比例。\n\n這些處理，是讓不同交易能用一致的方式比較。欄位也不是越多越好。編號只拿來對齊，總價留在答案欄，都不能當估價線索。\n\n完整備註可能寫到價格，解約資訊可能在交易之後才出現，因此不直接放進模型。備註只保留有限的條件旗標。建築完成年月在這份資料不可用，管理組織又全部相同，也就排除。\n\n另外，我們使用開放街圖的道路位置，補充不含價格的地理資訊。單價CatBoost這個模型共有九十五欄，其中二十三欄是地區名稱這類分類文字。其他模型的編碼維度不同。\n\n道路位置只能表示大致區域，不能當成每間房的精確門牌座標。", "seconds": 60}, {"number": 8, "title": "時間回測與過擬合", "takeaway": "用當時以前的資料學習，檢查下一年的預測。", "script": "接下來，要怎麼檢查模型是真的學會，還是只記住練習題？如果模型連資料裡偶然出現的細節都記下來，換一批交易就估不準，這叫過擬合。房市又會隨時間改變，所以我們用時間來分練習和考試。\n\n每一次，只讓模型看評分期間以前的資料，再預測後面一年，總共檢查三個年度。這個界線不只管模型。把文字轉成數字的規則、區域價格參考，也都要重新用當期訓練資料建立。\n\n否則後面的答案，可能從這些步驟偷偷流進來，這叫資料洩漏。三個年度能看出跨期表現，但還有限制：研究中已經反覆看過這些窗口，還是可能挑到剛好適合它們的配方。因此時間回測很重要，卻不能當成一份從來沒看過的隱藏考卷。", "seconds": 50}, {"number": 9, "title": "樹模型與神經網路", "takeaway": "兩種模型用不同方式學習房屋條件與價格的關係。", "script": "模型怎麼從線索估價？這次用了兩種方式。第一種是樹模型，可以想成一連串條件判斷，例如面積在哪個範圍、房子位在哪個地區。\n\n判斷條件和門檻由資料學出來，再讓很多棵小樹接著修正估價誤差。我們使用的兩套工具，叫CatBoost和LightGBM。第二種是神經網路。\n\n它把面積等數值，以及建案等分類資訊，整理成一組數字，再經過多層計算，學習這些條件一起出現時，價格會怎麼變。代表建案的數字也會隨訓練調整，不是人工指定某個建案比較高級。兩種方式有機會補上彼此的不足。\n\n但這只是設計理由，模型比較多，不一定就更準。最後還是要看完整組合的回測，不能說每個零件都已經單獨證明有效。", "seconds": 50}, {"number": 10, "title": "總價、單價與對數", "takeaway": "換一種價格表示來學習，最後都還原成總價。", "script": "價格也可以換一種寫法來學。第一種直接學總價。第二種先把總價除以有效面積，學每平方公尺單價，估完再乘回面積。\n\n這裡為什麼要給面積加權？用兩間房來看，一間五十平方公尺，另一間一百平方公尺。假設單價都估錯一萬元，總價就分別錯五十萬和一百萬。\n\n如果訓練時把這兩個單價誤差看得一樣重，就沒有反映比賽真正關心的總價差距。因此面積越大，單價誤差在學習中的分量也越大。建物面積不可用時，依固定規則改用車位面積；再沒有才用一，讓數值換算能進行。\n\n第三種是對數，把很大的金額壓縮，提供另一個學習角度。它訓練時看的是對數尺度誤差。這幾種寫法最後都要換回總價元，才能放在一起組合和評分。", "seconds": 55}, {"number": 11, "title": "近期成交權重", "takeaway": "讓較近期的成交，在單價 CatBoost的學習中占較高比重。", "script": "房屋大小會影響價格，成交時間也可能有影響。我們的想法是，近期成交可能更接近目前市場，所以在單價CatBoost裡，讓近期資料對學習有較大影響。這個影響大小就叫權重。\n\n它調整的是一筆誤差有多重要，不是直接修改房價。先看簡單比例：最近的成交算一，一年前算零點五，兩年前算零點二五。每過三百六十五天，較早交易的相對權重就減半，所以叫半衰期。\n\n實際程式還有一步：把合法日期的權重，除以這些權重的平均值，統一尺度。日期無效的資料則給一，當作中性值。最後再乘上上一頁的面積權重。\n\n其他分支有自己的設定，不能說全部模型都加了同一套新權重。較近期的資料，也不一定更可靠，近期資料同樣可能有雜訊，效果還是要用回測確認。", "seconds": 55}, {"number": 12, "title": "價格先驗與分組學習", "takeaway": "先從其他建案整理價格基準，再學這筆交易如何調整。", "script": "其中一個神經網路，會先拿到區域的參考單價，再學這間房應該調高或調低多少。這個估價起點，叫價格先驗，仍然是從訓練資料的成交價格整理出來。但要注意：如果先用某筆交易的答案算參考價，再拿這個參考價訓練同一筆，模型就可能偷看到答案。\n\n怎麼避開？我們按建案分成五組，同一建案一定放在同一組。輪到其中一組時，用另外四組建立它的訓練參考價。\n\n五組輪流做，就能避免自己的建案答案直接混進自己的先驗。這種處理叫折外，英文縮寫是ＯＯＦ。真正預測新交易時，才使用該次全部訓練資料建立的保存先驗。\n\n另外要分清楚：這裡是按建案分組，不是按日期排序。因此不能說每筆訓練參考價都只來自更早成交，也不能說這樣就完全不會過擬合。", "seconds": 55}, {"number": 13, "title": "六個模型與三條分支", "takeaway": "六個模型先換回總價，再按固定比例形成三條分支的初估。", "script": "把前面的做法放在一起，總共有六個模型。三個CatBoost分別學單價、總價和對數總價；一個LightGBM學單價；另外兩個是神經網路。一個用面積把單價連到總價，另一個以價格先驗為起點。\n\n這六個模型不是直接全部平均。我們先把預測都換回總價元，再分成三條估價分支。第一條以單價CatBoost為主。\n\n第二條先平均兩個神經網路。第三條先平均直接總價和對數總價兩個樹模型。每一條都再加入同一個LightGBM的意見：主要部分占七成五，LightGBM占兩成五。\n\n用一間房的教學例子來算，單價CatBoost換回總價後估一千萬元，LightGBM估一千兩百萬元。分別乘上七成五和兩成五，加起來是一千零五十萬元。這只是一條分支的初估，下一頁還要修正。\n\n這樣安排，是希望保留不同估價方式的差異。比例是固定配方，不代表已證明最佳；成績要看整個組合，各支的改善不能直接相加。", "seconds": 60}, {"number": 14, "title": "成交參考與空間修正", "takeaway": "每條分支各自修正，完成後仍有三個總價。", "script": "現在有三條分支的初估，接下來每一條都各自做兩步修正。因為模型學的是整體關係，特定建案或街區，可能還有細部價格差異。第一步，找訓練資料裡同建案、同地址或同道路的可比成交，再配合從訓練資料估出的時間趨勢，調整初估。\n\n第二步，如果前面的成交參考較弱，就用粗略道路位置附近的歷史資訊補充，也會檢查城市、建物型態和用途是否相容。這一步叫空間修正，會同時看原本的初估，以及第一步修正後的結果。不是找到附近一筆就直接照抄，而是依支持條件決定能採用多少；資訊不夠，就回退。\n\n這些價格都來自當期訓練資料，沒有到外部實價登錄找測試答案。道路位置也不等於精確門牌，所以這只是有限度的補充，不表示知道每間房的真正市價。三條分支各自做完後，手上仍然有三個總價，下一頁才合成最後一個。", "seconds": 60}, {"number": 15, "title": "逐筆取中位數", "takeaway": "三條分支都修正完成後，每筆交易採用中間的估價。", "script": "三個總價，最後選哪一個？我們把它們由小到大排好，取中間那個，這就叫中位數。用教學例子來看，三條分支修正後，分別估九百八十萬、一千零二十萬和一千八百萬元。\n\n排好之後，中間是一千零二十萬元，就採用這個價格。為什麼這樣做？如果其中一條估得特別高，直接平均會把結果往上拉；中位數可以減少單一極端估價的影響。\n\n但它也有代價。假如那個很高的估價剛好才是正確答案，中位數反而可能把有用資訊捨掉。如果三條分支一起低估，取中間也不會自動變準。\n\n所以沒有保證每次都比較好。順序也要記住：先換回總價，各支完成成交和空間修正，最後才取中位數。到了這裡已經是總價，不能再乘一次面積。", "seconds": 50}, {"number": 16, "title": "三期時間回測", "takeaway": "不同年度各自評分，用來檢查跨時期表現。", "script": "方法說完，來看實際結果。最早一期預測的是二〇二一年八月到二〇二二年八月，平均絕對誤差約兩百三十點九四萬元。中間一期約一百四十點七四萬元，最新一期約一百三十八點三二萬元。\n\n每一期都只用當時以前的資料，建立剛才介紹的完整方法；到了評分時，才拿後面一年的總價答案來比較。數字一路下降，卻不能解讀成模型逐年進步。因為三個年度考的是不同交易，房屋組成、交易量和市場狀況都不一樣。\n\n這張表能說的是，同一套方法在三批歷史資料各自表現如何，不能拿最低的那個數字保證未來結果。另外，我們不只看整體平均，也分季度、建案和價格群檢查。有時整體看起來更好，某一群卻變差。\n\n這些不利結果同樣要留下，才能知道方法在哪些地方還有弱點。", "seconds": 55}, {"number": 17, "title": "Kaggle 公開成績", "takeaway": "公開部分平均相差約 199.86 萬元，隱藏分數仍未知。", "script": "再來是平台回報的公開成績。精確數字寫在投影片上，換成萬元，大約是一百九十九點八六萬元，也就是接近兩百萬元。按照前面的ＭＡＥ定義，它表示公開評分那批交易，每筆預測總價和真價的絕對差，平均接近兩百萬。\n\n這是我提交後，平台回報的結果，已保存截圖。公開評分只涵蓋約三成測試資料，其餘約七成的隱藏分數還不知道。也不能直接和上一頁某個年度相比，就說提交後進步或退步，因為兩邊評分的交易不同。\n\n這是目前已觀察到的成果。最後名次要看隱藏部分，所以選定這個模型，並不代表已經證明它在隱藏資料最好。平均差兩百萬，也不表示每間房的誤差都在兩百萬以內。", "seconds": 50}, {"number": 18, "title": "限制與防過擬合", "takeaway": "保留不利結果，才能知道現在的證據支持到哪裡。", "script": "最後整理幾個限制。第一，歷史回測的窗口已經反覆看過，配方可能越來越適合這幾份考卷，卻不一定同樣適合新交易。第二，整體平均會藏住局部問題，例如某些高價交易群仍然退步，不能只挑好看的分數。\n\n第三，地理資訊有精度限制。道路代表位置不等於真正門牌，地址也不一定能匹配成功。各年度雖然用了對應的非價格道路快照，仍不能把它當成精準定位或完整生活機能。\n\n要減少這些風險，我們會先固定問題和時間切分，讓所有需要學習的規則，只看當期訓練資料，再一起檢查整體和分群結果，保留失敗方案。公開分數可以參考，但不能一看到變動，就不停改比例、追著它調整。這些做法能減少過擬合風險，不能完全消除。\n\n三條分支也可能一起估錯，這個限制仍然存在。", "seconds": 55}, {"number": 19, "title": "最終訓練與程式重現", "takeaway": "保存模型能重新推論同一份 test，重現原提交。", "script": "方法確定後，最後用四十六萬七千二百二十一筆有答案資料，建立模型和需要保存的規則，再預測全部四萬七千零七十三筆測試交易。提交檔只有編號和總價元兩欄，照範本順序排列，最後才一次取整成正整數。程式有一個統一的推論入口。\n\n它從原始測試表重新做特徵，載入六個模型，以及保存的編碼、價格參考和地理狀態，再算出三條分支與最後結果。我們已經實際重跑，全部預測和原提交一致，整份提交檔也相同。這能證明保存模型可以重新推論。\n\n剛才的重現驗證，是重新載入保存模型，沒有從頭重訓全部模型，也還沒在全新電腦驗證安裝流程。程式包附有必要檔案清單，模型和交易資料要另外具備，所以只下載程式，還不等於拿到了全部訓練素材。", "seconds": 55}, {"number": 20, "title": "結論", "takeaway": "完整流程把資料、估價方法與結果證據連在一起。", "script": "回到一開始的問題：只有房屋條件，怎麼估總價？我們先整理原始資料，把條件轉成模型能比較的線索，再用已知成交學估價規則。不同模型從總價、單價和對數等角度學習。\n\n單價的面積權重，讓學習對齊總價誤差；日期權重，讓近期成交在特定模型裡占較大分量。六個模型組成三條分支，各自經過成交和空間修正，最後取中位數。我們用三期時間回測和平台公開分數檢查，也完成保存模型的推論重現。\n\n每一步都有設計理由，也有證據的限制。目前公開平均誤差接近兩百萬元，隱藏分數仍然未知。以上是這次的完整流程，謝謝大家。", "seconds": 45}]}</script><script>
'use strict';
const deck=JSON.parse(document.getElementById('deckData').textContent),slides=deck.slides,key='v22-rehearsal-'+deck.source_sha256;
const el=id=>document.getElementById(id),blank=()=>({index:0,ms:Array(20).fill(0),covered:Array(20).fill(false),notes:Array(20).fill('')});
let state=blank(),running=false,last=performance.now(),saved=true;
try{const v=JSON.parse(localStorage.getItem(key));if(v&&Number.isInteger(v.index)&&v.index>=0&&v.index<20&&Array.isArray(v.ms)&&v.ms.length===20&&v.ms.every(x=>Number.isFinite(x)&&x>=0)&&Array.isArray(v.covered)&&v.covered.length===20&&v.covered.every(x=>typeof x==='boolean')&&Array.isArray(v.notes)&&v.notes.length===20&&v.notes.every(x=>typeof x==='string'))state=v;}catch(e){saved=false;}
function save(){try{localStorage.setItem(key,JSON.stringify(state));}catch(e){saved=false;}if(!saved)el('storage').textContent='此瀏覽器無法保存紀錄；離開前請下載紀錄，關閉後資料可能遺失。';}
function accrue(){const now=performance.now();if(running)state.ms[state.index]+=Math.max(0,now-last);last=now;}
const fmt=ms=>{const s=Math.floor(ms/1000);return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;};
function clocks(){el('total').textContent=fmt(state.ms.reduce((a,b)=>a+b,0));el('pageTime').textContent=fmt(state.ms[state.index]);}
const sequences={12:'先把同建案放在同一組 → 用其他四組算訓練參考價 → 神經網路再學如何調整。這是按建案分組，與第 8 頁按時間回測不同。',13:'六個模型 → 全部換回總價 → 形成三條初估。兩個神經網路先平均；總價和對數樹模型也先平均；每條再加入同一個 LightGBM。',14:'每條初估各自做成交參考修正，再做空間補充。完成後仍有三個總價，還沒有取中位數。',15:'三條都修正完 → 排序 → 取中間的總價。不再乘面積；三條一起估錯時，中位數也救不了。'};
slides.forEach((s,i)=>{const o=document.createElement('option');o.value=i;o.textContent=`${String(s.number).padStart(2,'0')} · ${s.title}`;el('pageSelect').append(o);});
function render(){const s=slides[state.index];el('pageSelect').value=state.index;el('title').textContent=`${String(s.number).padStart(2,'0')} / 20　${s.title}`;el('cue').textContent=s.takeaway;el('script').textContent=s.script;el('planned').textContent=`原講稿本頁配速參考：${s.seconds} 秒；這是估計，請先自然講完。`;el('covered').checked=state.covered[state.index];el('note').value=state.notes[state.index];el('sequence').hidden=!sequences[s.number];el('sequence').textContent=sequences[s.number]||'';el('prev').disabled=state.index===0;el('next').disabled=state.index===19;clocks();}
function navigate(i){accrue();state.index=i;el('details').open=false;el('results').hidden=true;save();render();}
el('prev').onclick=()=>navigate(Math.max(0,state.index-1));el('next').onclick=()=>navigate(Math.min(19,state.index+1));el('pageSelect').onchange=e=>navigate(Number(e.target.value));
el('toggle').onclick=()=>{accrue();running=!running;if(running)el('results').hidden=true;el('toggle').textContent=running?'暫停計時':'繼續計時';el('status').textContent=running?'正在計時；離席請暫停。':'已暫停，暫停期間不計入主講。';save();clocks();};
el('covered').onchange=e=>{state.covered[state.index]=e.target.checked;save();if(!el('results').hidden)summary();};el('note').oninput=e=>{state.notes[state.index]=e.target.value;save();if(!el('results').hidden)summary();};
function report(){return {exported_at:new Date().toISOString(),script_sha256:deck.source_sha256,total_seconds:state.ms.reduce((a,b)=>a+b,0)/1000,minimum_seconds:720,self_confirmed_pages:state.covered.filter(Boolean).length,content_completion_verified:false,measurement:'manual stopwatch; no speech recording or automatic content verification',slides:slides.map((s,i)=>({number:s.number,title:s.title,seconds:state.ms[i]/1000,self_confirmed:state.covered[i],note:state.notes[i]}))};}
function summary(){const r=report();el('resultSummary').textContent=`已計時 ${fmt(r.total_seconds*1000)}；自己確認講完 ${r.self_confirmed_pages} / 20 頁。${r.total_seconds>=720?'計時已到 12 分鐘，仍需確認每頁內容都有說清楚。':'計時尚未到 12 分鐘，先檢查是否漏了方法理由與算例，不靠等待補時間。'}`;el('rows').replaceChildren();r.slides.forEach(s=>{const tr=document.createElement('tr');[`${s.number}. ${s.title}`,fmt(s.seconds*1000),s.self_confirmed?'已講完':'未確認',s.note||'—'].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.append(td);});el('rows').append(tr);});}
el('finish').onclick=()=>{accrue();running=false;el('toggle').textContent='繼續計時';el('status').textContent='已停止計時，可以查看紀錄或繼續練習。';save();clocks();summary();el('results').hidden=false;el('results').focus();};
el('download').onclick=()=>{accrue();const url=URL.createObjectURL(new Blob([JSON.stringify(report(),null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='v22-rehearsal-record.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
el('reset').onclick=()=>{if(!confirm('清空這個瀏覽器的本次排練紀錄？如需保留，請先下載。'))return;running=false;state=blank();last=performance.now();save();el('results').hidden=true;el('toggle').textContent='開始計時';el('status').textContent='已清空，請從第一頁開始。';render();};
setInterval(()=>{accrue();clocks();if(running)save();},500);
addEventListener('pagehide',()=>{accrue();running=false;save();el('toggle').textContent='繼續計時';el('status').textContent='已保存並暫停；按繼續計時再開始。';});
addEventListener('pageshow',()=>{last=performance.now();clocks();});
render();save();if(state.ms.some(x=>x>0)){el('toggle').textContent='繼續計時';el('status').textContent='已載入上次紀錄，目前暫停；按繼續計時再開始。';}
</script></body></html>

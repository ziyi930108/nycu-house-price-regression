name: Source and submission checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Verify published source identities
        run: python scripts/verify_source.py
      - name: Install small test dependencies
        run: python -m pip install numpy==2.3.5 pandas==3.0.1
      - name: Check submission rules
        run: python -m unittest discover -s tests -v
